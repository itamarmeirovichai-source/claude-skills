[project]
name = "news1"
version = "0.1.0"
description = "NEWS-1: forward-only paper experiment on overnight news. Read-only, no broker, no keys."
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 170

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
