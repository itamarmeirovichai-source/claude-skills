# Publishes the Smash House Burgers concept proposal to GitHub Pages.
#
# No secrets needed: the repository is public and the workflow's own GITHUB_TOKEN
# is enough. The page ships noindex plus a disallow-all robots.txt, and carries a
# "not affiliated" footer.
name: Publish proposal site

on:
  push:
    branches: [claude/brave-newton-foxxj0]
    paths: ['site/**', '.github/workflows/publish-proposal-site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bundle the site into one file
        working-directory: site
        run: node build.cjs

      - name: Refuse to publish a broken bundle
        run: |
          test -s site/dist/index.html
          grep -q 'data-seq-canvas' site/dist/index.html
          grep -q 'noindex' site/dist/index.html
          grep -q 'Concept proposal for Smash House Burgers' site/dist/index.html
          echo "bundle ok: $(wc -c < site/dist/index.html) bytes"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
