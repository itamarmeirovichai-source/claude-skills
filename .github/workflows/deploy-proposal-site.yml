# Deploys the Smash House Burgers concept proposal to Cloudflare Pages.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   a token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  the account ID from the Cloudflare dashboard sidebar
#
# The site is one static file. It ships noindex via dist/_headers and dist/robots.txt,
# and the page itself carries a "not affiliated" footer.
name: Deploy proposal site

on:
  push:
    branches: [claude/brave-newton-foxxj0, main]
    paths: ['site/**', '.github/workflows/deploy-proposal-site.yml']
  workflow_dispatch:

concurrency:
  group: pages-proposal
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bundle the site into one file
        working-directory: site
        run: node build.cjs

      - name: Fail if the bundle looks wrong
        working-directory: site
        run: |
          test -s dist/index.html
          grep -q 'data-seq-canvas' dist/index.html
          grep -q 'noindex' dist/index.html
          echo "bundle ok: $(wc -c < dist/index.html) bytes"

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=smash-house-proposal --branch=main
